# Continuous Integration — runs automatically on pushes and pull requests
# to main and feature branches. Does not deploy.

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  APP_ENV: development
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: fraud_detection
  DB_USER: postgres
  DB_PASSWORD: postgres
  GROQ_API_KEY: ci-placeholder-not-used
  PORTAL_SECRET: ci-test-secret-at-least-32-characters-long
  COOKIE_SECURE: "false"
  GROQ_SSL_VERIFY: "false"
  SCHEMA_STRICT: "false"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -m "not integration and not live_groq" -q --tb=short

  portal-static:
    name: Static portal assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify static analyst portal
        run: |
          set -euo pipefail
          test -f static/analyst-portal/index.html
          test -f static/analyst-portal/app.js
          test -f static/analyst-portal/styles.css
          test -f static/analyst-portal/i18n.js
          test -f static/analyst-portal/assets/portal-bg.jpg
          # Background must be the compressed JPEG (PNG was removed).
          test ! -f static/analyst-portal/assets/portal-bg.png
          grep -q 'portal-bg\.jpg' static/analyst-portal/styles.css
          ! grep -q 'portal-bg\.png' static/analyst-portal/styles.css

      - name: Verify static customer portal
        run: |
          set -euo pipefail
          test -f static/customer-portal/index.html
          test -f static/customer-portal/app.js
          test -f static/customer-portal/styles.css
          test -f static/customer-portal/i18n.js
          # Shop loads shared Matx shell from /portal/styles.css (analyst styles).
          grep -q '/portal/styles.css' static/customer-portal/index.html

      - name: Verify Keycloak compose env (no empty proxy headers)
        run: |
          set -euo pipefail
          # Empty KC_PROXY_HEADERS="" crashes Keycloak 26.
          if grep -E '^\s*KC_PROXY_HEADERS:' podman-compose.yaml; then
            echo "KC_PROXY_HEADERS must not be set in compose (omit for local start-dev)." >&2
            exit 1
          fi
          if grep -E '^\s*KC_HOSTNAME:' podman-compose.yaml; then
            echo "KC_HOSTNAME must not be set empty in compose; set only in production .env." >&2
            exit 1
          fi

  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraud_detection"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Initialize database schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d fraud_detection \
            -f init_scripts/ecommerce_fraud/schema.sql

      - name: Run integration tests
        run: python -m pytest -m integration -q --tb=short
