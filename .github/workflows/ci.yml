# Continuous Integration — runs automatically on pushes and pull requests
# to main and feature branches. Does not deploy.

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: fraud_detection
  DB_USER: postgres
  DB_PASSWORD: postgres
  GROQ_API_KEY: ci-placeholder-not-used
  PORTAL_SECRET: ci-test-secret

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -m "not integration and not live_groq" -q --tb=short

  portal-build:
    name: Analyst portal build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: analyst-portal/package-lock.json

      - name: Install and build React portal
        working-directory: analyst-portal
        run: |
          # Lockfile was generated on Windows; npm install resolves Linux native optional deps on CI.
          npm install
          npm run build

      - name: Restore static background asset
        run: |
          mkdir -p static/analyst-portal/assets
          cp analyst-portal/public/assets/portal-bg.png static/analyst-portal/assets/portal-bg.png

      - name: Verify build output
        run: |
          test -f static/analyst-portal/index.html
          ls static/analyst-portal/assets/index-*.js
          ls static/analyst-portal/assets/index-*.css

      - name: Upload portal artifact
        uses: actions/upload-artifact@v4
        with:
          name: analyst-portal-${{ github.sha }}
          path: static/analyst-portal/
          retention-days: 7

  integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraud_detection
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fraud_detection"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Initialize database schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d fraud_detection \
            -f init_scripts/ecommerce_fraud/schema.sql

      - name: Run integration tests
        run: python -m pytest -m integration -q --tb=short
